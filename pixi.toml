[workspace]
name = "claude-science-container"
version = "0.1.0"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

# 单一构建产物：proxy 桥 + forward/local CLI 在同一个二进制里。
[tasks.build]
cmd = "go build -trimpath -ldflags=\"-s -w\" -o claude-science-container ."

# 交叉编译发布包（dist/claude-science-container-<os>-<arch>）。
[tasks.build_all]
cmd = "sh -c 'set -e; mkdir -p dist; for pair in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do os=${pair%/*}; arch=${pair#*/}; out=dist/claude-science-container-$os-$arch; if [ \"$os\" = windows ]; then out=$out.exe; fi; GOOS=$os GOARCH=$arch go build -trimpath -ldflags=\"-s -w\" -o \"$out\" .; done'"

[tasks.test]
cmd = "go test ./..."

[tasks.vet]
cmd = "go vet ./..."

[tasks.test_bridge]
cmd = "go test ./proxy/..."

[tasks.clean]
cmd = "rm -rf dist claude-science-container"

[tasks.build_image]
cmd = "docker compose build --build-arg CACHE_BUST=$(date +%s)"

[activation.env]
CGO_ENABLED = "0"
PATH = "$HOME/go/bin:$PATH"

[dependencies]
go = ">=1.26.4,<2"
